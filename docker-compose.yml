services:
  db:
    image: postgres:17-alpine
    container_name: menu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
      POSTGRES_DB: menu
    ports:
      - "5436:5432"
    volumes:
      - menu-pgdata:/var/lib/postgresql/data

  menu:
    build: .
    container_name: menu-admin
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  menu-pgdata:
